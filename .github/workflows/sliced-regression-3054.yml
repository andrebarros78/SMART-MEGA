name: SMART-MEGA Sliced Regression 3054

on:
  push:
    branches: [regression/sliced-3054]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Slice - test_smart_3054_full_cycle_sandbox.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q test_smart_3054_full_cycle_sandbox.py -p no:cacheprovider --disable-warnings
