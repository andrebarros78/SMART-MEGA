name: Repository Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Match existing canonical text checkout
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install the existing project dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: GitHub-native identity and canonical runtime integrity
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python smart_repository_integrity.py
