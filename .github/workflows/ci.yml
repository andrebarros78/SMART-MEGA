name: SMART-MEGA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Full regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider --disable-warnings --junitxml=SMART_AUDIT_JUNIT_GITHUB.xml
      - name: Upload JUnit evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: smart-mega-junit
          path: SMART_AUDIT_JUNIT_GITHUB.xml
