name: SMART-MEGA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Match existing canonical text checkout
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
      - name: Dependency integrity
        run: python -m pip check
      - name: Build canonical component reachability registry
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python smart_component_reachability.py --write SMART_COMPONENT_REACHABILITY_REGISTRY.json
      - name: Build canonical component registry
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python smart_canonical_component_registry.py --write SMART_CANONICAL_COMPONENT_REGISTRY.json
      - name: Build skill adapter registry
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python smart_skill_adapter_registry.py --write SMART_SKILL_ADAPTER_REGISTRY.json
      - name: Full regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider --disable-warnings --junitxml=SMART_AUDIT_JUNIT_GITHUB.xml
      - name: Validate GitHub certification renewal
        if: github.event_name == 'pull_request'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python smart_github_certify.py
  certify:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: smart-mega-main-operation
      cancel-in-progress: false
    steps:
      - name: Match existing canonical text checkout
        run: git config --global core.autocrlf true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - name: Build canonical component reachability registry
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python smart_component_reachability.py --write SMART_COMPONENT_REACHABILITY_REGISTRY.json
      - name: Build canonical component registry
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python smart_canonical_component_registry.py --write SMART_CANONICAL_COMPONENT_REGISTRY.json
      - name: Build skill adapter registry
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python smart_skill_adapter_registry.py --write SMART_SKILL_ADAPTER_REGISTRY.json
      - name: Generate same-commit JUnit for certification
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider --disable-warnings --junitxml=SMART_AUDIT_JUNIT_GITHUB.xml
      - name: Renew construction certification for tested source
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python smart_github_certify.py
      - name: Persist only certified evidence to canonical main
        run: |
          git add -- .gitattributes SMART_COMPONENT_REACHABILITY_REGISTRY.json SMART_CANONICAL_COMPONENT_REGISTRY.json SMART_SKILL_ADAPTER_REGISTRY.json SMART_AUDIT_JUNIT_CURRENT.xml SMART_CANONICAL_ROOT.json SMART_PRODUCT_CERTIFICATION.json SMART_AGENT_ECOSYSTEM_GOVERNANCE.json SMART_GLOBAL_INTEGRITY_PROOF.json SMART_3052_IMPLEMENTATION_GATE.json SMART_P09_RED_TEAM_LATEST.json SMART_AGENT_ECOSYSTEM_ACQUISITIONS_20260915.json
          git diff --cached --check
          for file in SMART_COMPONENT_REACHABILITY_REGISTRY.json SMART_CANONICAL_COMPONENT_REGISTRY.json SMART_SKILL_ADAPTER_REGISTRY.json SMART_AUDIT_JUNIT_CURRENT.xml SMART_CANONICAL_ROOT.json SMART_PRODUCT_CERTIFICATION.json SMART_AGENT_ECOSYSTEM_GOVERNANCE.json SMART_GLOBAL_INTEGRITY_PROOF.json SMART_3052_IMPLEMENTATION_GATE.json SMART_P09_RED_TEAM_LATEST.json SMART_AGENT_ECOSYSTEM_ACQUISITIONS_20260915.json; do
            git show ":$file" | cmp - "$file"
          done
          git -c user.name="SMART-MEGA GitHub Certification" -c user.email="smart-mega-certification@users.noreply.github.com" commit -m "certify: GitHub regression for ${{ github.sha }}"
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
