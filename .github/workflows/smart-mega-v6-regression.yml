name: SMART Mega V6 - isolated regression
on:
  push:
    branches:
      - ci/smart-mega-v6-validation-20261027
  pull_request:
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - '.github/workflows/smart-mega-v6-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-mega-v6-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Full hermetic regression
        run: |
          mkdir -p test-results
          python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smart-mega-v6-pytest-${{ github.run_id }}
          path: test-results/
          if-no-files-found: warn
